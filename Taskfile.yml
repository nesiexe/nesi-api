version: 3

tasks:
  default:
    cmds:
      - task -a

  # API
  api:up:
    desc: Start the API dev server
    dir: .
    cmds:
      - npm run dev

  api:build:
    desc: Build the API
    cmds:
      - npm run build

  api:start:
    desc: Start the compiled API
    cmds:
      - npm start

  api:typecheck:
    desc: Type-check the API and tests
    cmds:
      - npm run typecheck

  api:test:
    desc: Run Vitest once
    cmds:
      - npm test

  api:test:watch:
    desc: Run Vitest in watch mode
    cmds:
      - npm run test:watch

  api:lint:
    desc: Lint the API code
    cmds:
      - npm run lint

  api:lint:fix:
    desc: Lint the API code and fix issues
    cmds:
      - npm run lint:fix
